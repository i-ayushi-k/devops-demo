name: Python DevOps Pipeline

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Build
        run: python -m py_compile x.py

  run:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run
        run: python x.py

  execute:
    needs: run
    runs-on: ubuntu-latest

    steps:
      - name: Execute
        run: echo "Execution completed successfully"